# Configuracion de busybox httpd para el robot RumBa.
#
# Todo lo que cuelgue de /cgi-bin/ se ejecuta como CGI automaticamente,
# asi que robot_api.cgi no necesita declararse aqui.
#
# La autenticacion real (login con cookie de sesion, ver web/API.md) la
# hace el propio CGI. Estas reglas solo bloquean el acceso directo a
# rutas que no deben servirse como archivos estaticos.

# Negar acceso a la carpeta de audio por HTTP directo:
# los MP3 se sirven a traves de la API, no como listado de directorio.
D:/audio

# Permitir el resto.
A:*

# Pagina de error simple
E404:/index.html
