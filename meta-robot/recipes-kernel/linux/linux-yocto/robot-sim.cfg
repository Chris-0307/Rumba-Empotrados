# Interfaz de caracteres GPIO (la que usa libgpiod v2)
CONFIG_GPIOLIB=y
CONFIG_GPIO_CDEV=y

# gpio-sim crea chips GPIO virtuales via configfs.
# Permite ejecutar el codigo de LEDs de librobot tal cual, sin hardware.
CONFIG_CONFIGFS_FS=y
CONFIG_GPIO_SIM=m

# i2c-stub emula un dispositivo I2C en /dev/i2c-N para probar el ADS1115.
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_STUB=m

# Tarjeta de sonido ficticia para que mpg123 tenga un dispositivo ALSA.
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_DUMMY=m
CONFIG_SND_ALOOP=m
